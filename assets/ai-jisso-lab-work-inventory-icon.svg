<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">業務の棚卸しアイコン</title>
  <desc id="desc">AI実装Labのブランドカラーで描いた、チェックリストを虫眼鏡で確認するアイコン</desc>

  <!-- Clipboard body -->
  <rect x="35" y="34" width="144" height="188" rx="24"
        fill="#FFFFFF" stroke="#0B3A63" stroke-width="10"/>

  <!-- Clipboard clip -->
  <rect x="73" y="18" width="68" height="34" rx="13"
        fill="#0A98A8" stroke="#0B3A63" stroke-width="9"/>

  <!-- Checklist rows -->
  <rect x="57" y="76" width="21" height="21" rx="5"
        fill="#8BC53F" stroke="#0B3A63" stroke-width="6"/>
  <path d="m61 86 5 5 9-11" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M91 86h58" fill="none" stroke="#0A98A8" stroke-width="9" stroke-linecap="round"/>

  <rect x="57" y="116" width="21" height="21" rx="5"
        fill="#FFFFFF" stroke="#0B3A63" stroke-width="6"/>
  <path d="M91 126h52" fill="none" stroke="#0A98A8" stroke-width="9" stroke-linecap="round"/>

  <rect x="57" y="156" width="21" height="21" rx="5"
        fill="#FFFFFF" stroke="#0B3A63" stroke-width="6"/>
  <path d="M91 166h39" fill="none" stroke="#0A98A8" stroke-width="9" stroke-linecap="round"/>

  <!-- Magnifying glass -->
  <circle cx="169" cy="165" r="45"
          fill="#FFFFFF" stroke="#0B3A63" stroke-width="10"/>
  <circle cx="169" cy="165" r="29"
          fill="#E9F7F5" stroke="#0A98A8" stroke-width="7"/>
  <path d="m155 165 10 10 20-24" fill="none" stroke="#8BC53F" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Handle -->
  <path d="M201 198 232 229" fill="none" stroke="#0B3A63" stroke-width="24" stroke-linecap="round"/>
  <path d="M201 198 232 229" fill="none" stroke="#0A98A8" stroke-width="12" stroke-linecap="round"/>
</svg>
